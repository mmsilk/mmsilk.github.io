<style>
  :root{
    --fs-mono:clamp(11px,.78cqw,15px);--fs-h2:clamp(28px,2.4cqw,52px);--fs-display:clamp(64px,8.6cqw,170px);--fs-xl:clamp(40px,4.4cqw,88px);

  *{box-sizing:border-box;margin:0;padding:0;}

  .nav .id{display:flex;gap:8cqw;align-items:center;}

  .nav .menu{display:flex;gap:3.2cqw;margin-left:auto;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:3.2cqw 1.1792cqw;margin:2.3585cqw 1.1792cqw 0;padding-bottom:8.2547cqw;}
  .tile{display:block;min-width:0;}
  .nm{font-family:var(--f-mono);font-size:var(--fs-mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.7075cqw;}

    :root{--fs-mono:13px;--fs-body:16px;--fs-lead:18px;--fs-h2:24px;--fs-xl:34px;--fs-display:min(11.5vw,64px)}
    body{min-width:0!important}

    /* home */

  /* ===== play canvas ===== */
  html.playpage,html.playpage body{height:100%;overflow:hidden}

  .page{max-width:none!important;container-type:normal!important}
  .nav{height:4.4811vw!important;min-height:56px;padding:0 1.1792vw!important;font-size:13px!important}
  .nav .id{gap:8vw}.nav .menu{gap:3.2vw}
  #cv{position:relative;width:100%;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  #cv.drag{cursor:grabbing}
  .t{position:absolute;left:0;top:0;will-change:transform;cursor:pointer;outline:none}
  .t .m{position:absolute;overflow:hidden;background:var(--ph)}
  .t video,.t img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  .t:hover video,.t:hover img,.t:focus-visible video,.t:focus-visible img{transform:scale(1.04)}
  .t .cap{position:absolute;left:0;white-space:nowrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);opacity:0;transition:opacity .25s;pointer-events:none}

  #hint{position:fixed;left:1.1792vw;bottom:18px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);transition:opacity .4s;pointer-events:none}
  #hint.off{opacity:0}
  /* popup */
  #pop{position:fixed;inset:0;z-index:120;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:70px 5vw 40px}
  #pop.on{display:flex}
  #pop .x{all:unset;cursor:pointer;position:absolute;top:14px;right:20px;font:300 38px/1 var(--f-sans);padding:12px;color:var(--ink)}
  #pop .mw{position:relative;max-width:min(1200px,90vw);max-height:calc(100vh - 210px);background:var(--ph)}
  #pop .mw video,#pop .mw img{display:block;width:100%;height:100%;object-fit:contain;background:var(--ph)}
  #pop .ctl{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:center;gap:14px}
  #pop .pill{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:40px;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  #pop .pill svg{width:14px;height:14px}
  #pop input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:linear-gradient(to right,#fff var(--v,0%),rgba(255,255,255,.35) var(--v,0%));cursor:pointer;outline:none}
  #pop input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff}
  #pop input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
  #pop .cp{margin-top:22px;width:min(1200px,90vw)}
  #pop .cp h2{font-family:var(--f-sans);font-weight:400;letter-spacing:-.02em;font-size:28px;line-height:1.1}
  #pop .cp p{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-top:10px}
  @media (max-width:809px){
    .nav{height:53px!important;min-height:0;padding:0 20px!important}
    #hint{left:20px;bottom:14px}
    #pop{padding:64px 0 24px}
    #pop .mw{max-width:100vw;max-height:calc(100vh - 190px)}
    #pop .cp{width:calc(100vw - 40px)}
    #pop .cp h2{font-size:22px}
    #pop .x{right:8px}
  }
</style>
<style id="pbg">html.playpage,html.playpage body{background:#E9E6DB}.nav{background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax);position:relative;z-index:5}</style>
<style id="mo">
@media (prefers-reduced-motion:no-preference){

<script>
(function(){
var ITEMS=[
 {id:'carblock',r:1,t:'CarBlock Token stickers',m:'Illustration',pv:'media/carblock.mp4',po:'posters/s_carblock.jpg',full:'media/carblock.mp4',fp:'posters/s_carblock.jpg'},
 {id:'asmr',r:16/9,t:'ASMR Animation',m:'Personal project',pv:'media/pv_asmr.mp4',po:'posters/s_asmr.jpg',full:'media/asmr.mp4',fp:'posters/asmr_full.jpg',snd:1},
 {id:'ieo',r:748/862,t:'International Economics Olympiad',m:'Character illustrations',pv:'media/ieo.mp4',po:'posters/s_ieo.jpg',full:'media/ieo.mp4',fp:'posters/s_ieo.jpg'},
 {id:'ai',r:16/9,t:'Various AI videos',m:'Freelance projects',pv:'media/pv_ai.mp4',po:'posters/s_ai.jpg',full:'media/ai.mp4',fp:'posters/ai_full.jpg',snd:1,ns:1},
 {id:'adtech',r:4/3,t:'Adtech corporate ski event',m:'Stickers · Graphic Design',img:'media/adtech_s.webp',full:'media/adtech.webp'},
 {id:'plant',r:16/9,t:'The Plant That Grew Too Far',m:'Personal project · Cinema 4D Toon shader',pv:'media/pv_plant.mp4',po:'posters/s_plant.jpg',full:'media/plant.mp4',fp:'posters/plant_full.jpg',snd:1},
 {id:'logrus',r:16/9,t:'Logrus IT explainer',m:'Design and Motion',pv:'media/pv_logrus.mp4',po:'posters/s_logrus.jpg',full:'media/logrus.mp4',fp:'posters/logrus_full.jpg',snd:1},
 {id:'logos',r:1280/692,t:'Logos',m:'Earlier work',pv:'media/logos.mp4',po:'posters/s_logos.jpg',full:'media/logos.mp4',fp:'posters/s_logos.jpg'}
];
var cv=document.getElementById('cv'),nav=document.getElementById('nav'),hint=document.getElementById('hint');
var W,H,T,PX,PY,px=0,py=0,vx=0,vy=0,els={},moved=0,down=false,lx,ly,lt,raf=0,inert=false;
function size(){
  W=innerWidth;H=innerHeight-nav.offsetHeight;cv.style.height=H+'px';
  T=Math.max(150,Math.min(W<810?W*.42:W*.17,300));PX=T*1.32;PY=T*1.36;
}
size();px=-PX*.45;py=-PY*.35;
function key(i,j){return i+','+j}
function idx(i,j){return(((i*2+j*3)%8)+8)%8}
function make(i,j){
  var it=ITEMS[idx(i,j)],r=it.r,w=r>=1?T:T*r,h=r>=1?T/r:T;
  var a=document.createElement('div');a.className='t';a.tabIndex=0;a.setAttribute('role','button');a.setAttribute('aria-label',it.t);a.dataset.id=it.id;
  var m=document.createElement('div');m.className='m';m.style.cssText='width:'+w+'px;height:'+h+'px;left:'+(PX-w)/2+'px;top:'+(PY-h)/2+'px';
  var el;
  if(it.img){el=document.createElement('img');el.src=it.img;el.alt=it.t;el.draggable=false}
  else{el=document.createElement('video');el.muted=true;el.loop=true;el.autoplay=true;el.playsInline=true;el.preload='metadata';el.poster=it.po;el.src=it.pv;el.setAttribute('muted','');el.setAttribute('playsinline','')}
  m.appendChild(el);a.appendChild(m);
  var c=document.createElement('span');c.className='cap';c.textContent=it.t;c.style.left=(PX-w)/2+'px';c.style.top=((PY-h)/2+h+8)+'px';a.appendChild(c);
  a.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openIt(it)}};
  a._it=it;
  return a;
}
function render(){
  var i0=Math.floor((-px-PX)/PX),i1=Math.ceil((W-px)/PX),j0=Math.floor((-py-PY)/PY),j1=Math.ceil((H-py)/PY),need={};
  for(var i=i0;i<=i1;i++)for(var j=j0;j<=j1;j++){
    var k=key(i,j);need[k]=1;
    if(!els[k]){els[k]=make(i,j);cv.appendChild(els[k]);var v=els[k].querySelector('video');if(v){var p=v.play();if(p&&p.catch)p.catch(function(){})}}
    els[k].style.transform='translate3d('+Math.round(i*PX+px)+'px,'+Math.round(j*PY+py)+'px,0)';
  }
  for(var k2 in els)if(!need[k2]){els[k2].remove();delete els[k2]}
}
function loop(){
  if(!down){
    px+=vx;py+=vy;vx*=.93;vy*=.93;
    if(Math.abs(vx)<.05&&Math.abs(vy)<.05){inert=false;vx=vy=0;render();return}
  }
  render();raf=requestAnimationFrame(loop);
}
function kick(){if(!inert){inert=true;raf=requestAnimationFrame(loop)}}
cv.addEventListener('pointerdown',function(e){
  down=true;moved=0;lx=e.clientX;ly=e.clientY;lt=performance.now();vx=vy=0;cv.classList.add('drag');
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  kick();
});
cv.addEventListener('pointermove',function(e){
  if(!down)return;

  if(moved>6)hint.classList.add('off');
});
function up(e){
  if(!down)return;down=false;cv.classList.remove('drag');
  if(moved<6){
    var t=document.elementFromPoint(e.clientX,e.clientY);t=t&&t.closest?t.closest('.t'):null;
    if(!t){var all=cv.querySelectorAll('.t');for(var q=0;q<all.length;q++){var m=all[q].querySelector('.m').getBoundingClientRect();if(e.clientX>=m.left&&e.clientX<=m.right&&e.clientY>=m.top&&e.clientY<=m.bottom){t=all[q];break}}}
    vx=vy=0;if(t&&t._it)openIt(t._it);

cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',function(e){e.preventDefault();px-=e.deltaX;py-=e.deltaY;hint.classList.add('off');vx=vy=0;kick();render()},{passive:false});
addEventListener('resize',function(){size();render()});
render();
/* popup */
var pop=document.getElementById('pop'),mw=document.getElementById('mw'),pt=document.getElementById('pt'),pm=document.getElementById('pm');
var ICON={pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>',play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',off:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></svg>',on:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>'};
function openIt(it){
  mw.innerHTML='';pt.textContent=it.t;pm.textContent=it.m;
  var maxW=Math.min(1200,innerWidth*.9),maxH=innerHeight-210;if(innerWidth<810)maxW=innerWidth;
  var w=Math.min(maxW,maxH*it.r),h=w/it.r;mw.style.width=w+'px';mw.style.height=h+'px';
  if(!it.full.match(/\.(mp4)$/)){var im=document.createElement('img');im.src=it.full;im.alt=it.t;mw.appendChild(im)}
  else{
    var v=document.createElement('video');v.src=it.full;v.poster=it.fp;v.loop=true;v.muted=true;v.autoplay=true;v.playsInline=true;v.setAttribute('playsinline','');mw.appendChild(v);
    var pl=v.play();if(pl&&pl.catch)pl.catch(function(){});
    if(it.snd){
      var c=document.createElement('div');c.className='ctl';
      c.innerHTML='<button class="pill" id="pb" aria-label="Pause">'+ICON.pause+'</button><input type="range" id="sk" min="0" max="1000" value="0" aria-label="Seek">'+(it.ns?'':'<button class="pill" id="sb" aria-pressed="false">'+ICON.off+'<span>Sound off</span></button>')+'';
      mw.appendChild(c);
      var pb=c.querySelector('#pb'),sk=c.querySelector('#sk'),sb=c.querySelector('#sb'),drag=false;
      pb.onclick=function(){if(v.paused)v.play();else v.pause()};
      v.addEventListener('play',function(){pb.innerHTML=ICON.pause});v.addEventListener('pause',function(){pb.innerHTML=ICON.play});
      v.addEventListener('timeupdate',function(){if(drag||!v.duration)return;sk.value=v.currentTime/v.duration*1000;sk.style.setProperty('--v',sk.value/10+'%')});
      sk.addEventListener('input',function(){drag=true;sk.style.setProperty('--v',sk.value/10+'%');if(v.duration)v.currentTime=sk.value/1000*v.duration});
      sk.addEventListener('change',function(){drag=false});
      if(sb)sb.onclick=function(){v.muted=!v.muted;var on=!v.muted;sb.setAttribute('aria-pressed',on);sb.innerHTML=(on?ICON.on:ICON.off)+'<span>'+(on?'Sound on':'Sound off')+'</span>';if(on&&v.paused)v.play()};
    }
  }
  pop.classList.add('on');
}
function closeIt(){pop.classList.remove('on');var v=mw.querySelector('video');if(v){v.pause();v.removeAttribute('src');v.load()}mw.innerHTML=''}
pop.querySelector('.x').onclick=closeIt;
pop.addEventListener('click',function(e){if(e.target===pop)closeIt()});
addEventListener('keydown',function(e){if(e.key==='Escape')closeIt()});
})();
</script>
<script>
(function(){var m=document.querySelector('.nav .menu'),n=document.querySelector('.nav');if(!m||!n)return;
var b=document.createElement('button');b.className='mbtn';b.type='button';b.textContent='Menu';b.setAttribute('aria-expanded','false');n.appendChild(b);
var o=document.createElement('div');o.className='mnu';o.innerHTML=m.innerHTML;document.querySelector('.page').appendChild(o);
function t(on){o.classList.toggle('on',on);document.body.classList.toggle('mopen',on);b.textContent=on?'Close':'Menu';b.setAttribute('aria-expanded',on)}
b.onclick=function(){t(!o.classList.contains('on'))};
window.addEventListener('resize',function(){if(innerWidth>809)t(false)});
})();
</script>
<script>
(function(){
var L=['.hero h1','.hero .tl','.title h1','.meta','.chap','.vg','.pgrid','.gal','.row','.splitrow','.longrow','.og','.other','.nx','.sw','.tile','.ab .lbl','.ab .tx','.ab .cv','.footer'];
var els=[];document.querySelectorAll(L.join(',')).forEach(function(e){if(e.closest('.rv')&&e.closest('.rv')!==e)return;e.classList.add('rv');els.push(e)});
var tl=document.querySelectorAll('.tile');tl.forEach(function(e,i){e.style.setProperty('--d',(i%2*.12)+'s')});
document.querySelectorAll('.hero h1').forEach(function(e){e.style.setProperty('--d','.05s')});
document.querySelectorAll('.hero .tl').forEach(function(e){e.style.setProperty('--d','.2s')});
document.querySelectorAll('.ab .tx').forEach(function(e){e.style.setProperty('--d','.12s')});
document.querySelectorAll('.ab .cv').forEach(function(e){e.style.setProperty('--d','.24s')});
function show(e){e.classList.add('in')}
if(!('IntersectionObserver' in window)){els.forEach(show);return}
var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){show(x.target);io.unobserve(x.target)}})},{rootMargin:'0px 0px -6% 0px'});
els.forEach(function(e){io.observe(e)});
setTimeout(function(){els.forEach(function(e){var r=e.getBoundingClientRect();if(r.top<innerHeight)show(e)})},1800);
})();
</script>
